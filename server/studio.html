<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>配音工作台</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1d21; --dim: #6b7280; --line: #d8dbe0; --bg: #fff; --accent: #e67e22; --ok: #27ae60; --err: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e7ea; --dim: #9aa4b2; --line: #3a3f47; --bg: #1b1d21; } }
  * { box-sizing: border-box; }
  /* 顶部留白：桌面端是无边框窗口，右上角有最小化/最大化/关闭，别让内容压在下面 */
  body { margin: 0; padding: 44px 16px 16px; font: 13px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--fg); }
  h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab { font: inherit; font-size: 12px; padding: 3px 12px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; opacity: .55; }
  .tab.on { opacity: 1; border-color: currentColor; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; }
  .dim { color: var(--dim); font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; background: var(--dim); }
  .dot.on { background: var(--ok); } .dot.busy { background: var(--accent); }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  button.act { font: inherit; font-size: 11px; padding: 2px 9px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; opacity: .85; text-decoration: none; }
  button.act:disabled { opacity: .4; cursor: default; }
  .item { display: flex; flex-direction: column; gap: 3px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .item:last-child { border-bottom: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .err { color: var(--err); font-size: 12px; white-space: pre-wrap; margin-bottom: 10px; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 12px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; }
  .empty { color: var(--dim); font-size: 12px; padding: 8px 0; }
</style>
</head>
<body>
<div class="row" style="margin-bottom:8px">
  <h1 style="margin:0">配音工作台</h1>
  <span class="grow"></span>
</div>
<div class="sub" id="sub">正在连接服务…</div>
<div class="tabs">
  <button class="tab on" data-tab="task">任务</button>
  <button class="tab" data-tab="history">历史</button>
  <button class="tab" data-tab="bank">音色库</button>
  <button class="tab" data-tab="queue">队列</button>
  <button class="tab" data-tab="config">参数</button>
</div>
<div id="compat"></div>
<div id="err"></div>
<div id="view"></div>
<script>
(function () {
  var BASE = '/api/dsh-tts/'
  // 页面需要的接口版本；插件启动时会在 status 里回自己的版本
  var NEED_API = 2
  var state = { tab: 'task', status: null, files: [], bank: {}, config: null, queue: null, draft: { type: 'text', text: '', textName: '', voice: '', title: '', xmlName: '', scriptName: '', sequence: '' },
    upload: { xmlText: '', scriptText: '' }, saving: false, saveMsg: '', loading: false, error: '', creating: false }
  function el(id) { return document.getElementById(id) }
  function api(name, opt) {
    return fetch(BASE + name, Object.assign({ cache: 'no-store' }, opt || {})).then(function (r) {
      if (r.status === 404) throw new Error('接口 ' + name + ' 不存在 —— 插件更新后需要重启 DSH')
      if (!r.ok) throw new Error('HTTP ' + r.status)
      return r.json()
    })
  }
  function post(name, body) {
    return api(name, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) })
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c] }) }
  function bytes(n) { return n < 1024 ? n + ' B' : n < 1048576 ? Math.round(n / 1024) + ' KB' : (n / 1048576).toFixed(1) + ' MB' }
  function ago(ts) {
    var s = Math.max(0, Math.round(Date.now() / 1000 - ts))
    return s < 60 ? s + ' 秒前' : s < 3600 ? Math.round(s / 60) + ' 分钟前' : s < 86400 ? Math.round(s / 3600) + ' 小时前' : Math.round(s / 86400) + ' 天前'
  }
  function fileUrl(p) { return '/api/file?path=' + encodeURIComponent(p) }

  // 页面是嵌在侧边栏 iframe 里的，没有"返回"这回事；
  // 嵌进来时把顶部为桌面窗口预留的留白收窄。
  var EMBEDDED = (function () { try { return window.self !== window.top } catch (e) { return true } })()
  if (EMBEDDED) {
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.paddingTop = '12px'
    })
  }

  function render() {
    var st = state.status || {}
    // 页面是文件、改完立刻生效；接口要靠重启 DSH。版本对不上就说清楚，
    // 否则用户只会看到一句 HTTP 404。
    var compat = state.compatFromApi || ''
    if (!compat && st && st.ok && (!st.apiVersion || st.apiVersion < NEED_API)) {
      compat = '页面比插件新（需要接口版本 ' + NEED_API + '，插件当前 ' + (st.apiVersion || '旧版') + '）。请重启 DSH 后再用队列与参数页。'
    }
    var compatEl = el('compat')
    if (compatEl) compatEl.innerHTML = compat ? '<div class="err" style="color:var(--accent)">' + esc(compat) + '</div>' : ''
    el('sub').textContent = st.online ? ('服务就绪' + (st.loaded ? ' · 已载入 ' + st.loaded : ' · 未载入模型')) : '服务待机（不影响浏览历史与音色库）'
    el('err').innerHTML = state.error ? '<div class="err">' + esc(state.error) + '</div>' : ''
    var h = ''
    if (state.tab === 'task') {
      var busy = st.online && st.busyReq
      if (busy) {
        var p = st.progress || {}
        var pct = p.total ? Math.round(p.done / p.total * 100) : 0
        var who = st.busyReq === 'say' ? '正在合成' : st.busyReq === 'preview' ? '正在出候选' : (st.busyReq === 'asr' || st.busyReq === 'asr_subs') ? '正在转写' : st.busyReq === 'align' ? '正在对齐' : '处理中'
        var detail = p.total ? ('第 ' + p.done + ' / ' + p.total + ' 句') : ('已用 ' + Math.round(st.busyS || 0) + ' 秒')
        h += '<div class="card"><div class="row"><i class="dot busy"></i><span>' + esc(who) + '</span><span class="grow"></span><button class="act" id="cancel">取消</button></div>'
          + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
          + '<div class="row"><span class="dim">' + esc(detail) + '</span><span class="grow"></span><span class="dim">' + pct + '%</span></div></div>'
      } else {
        h += '<div class="card"><div class="row"><i class="dot' + (st.online ? ' on' : '') + '"></i><span>' + (st.online ? '空闲' : '服务未启动') + '</span></div>'
          + '<div class="dim" style="margin-top:6px">' + (st.online ? '没有正在进行的任务。' : '查看历史与音色库只读文件，不会启动服务；改名/删除/新建音色时才需要。') + '</div></div>'
      }
      h += '<div class="card"><div class="dim">配音请在对话里让助手调用 voiceover；这里看进度、取消、翻产物和音色库。</div></div>'
    } else if (state.tab === 'queue') {
      h += renderQueue()
    } else if (state.tab === 'config') {
      h += renderConfig()
    } else if (state.tab === 'history') {
      h += '<div class="row" style="margin-bottom:8px"><span class="dim">共 ' + state.files.length + ' 个文件（最近 40 个）</span><span class="grow"></span><button class="act" id="refresh">刷新</button></div>'
      if (state.loading) h += '<div class="empty">读取中…</div>'
      else if (!state.files.length) h += '<div class="empty">还没有产物。</div>'
      else {
        h += '<div class="card">'
        state.files.forEach(function (f) {
          var audio = /\.(mp3|wav|m4a|flac)$/i.test(f.name)
          h += '<div class="item"><div class="row"><span class="name" title="' + esc(f.rel) + '">' + esc(f.name) + '</span><span class="grow"></span>'
            + (audio ? '<button class="act play" data-p="' + esc(f.path) + '">试听</button>' : '')
            + '<a class="act" href="' + fileUrl(f.path) + '" download="' + esc(f.name) + '">下载</a></div>'
            + '<div class="dim">' + esc((f.dir ? f.dir + ' · ' : '') + bytes(f.bytes) + ' · ' + ago(f.mtime)) + '</div></div>'
        })
        h += '</div>'
      }
    } else if (state.tab === 'bank') {
      var names = Object.keys(state.bank)
      h += '<div class="row" style="margin-bottom:8px"><span class="dim">共 ' + names.length + ' 个音色</span><span class="grow"></span><button class="act" id="refresh">刷新</button></div>'
      h += '<div class="card"><div class="row"><input type="text" id="newvoice" placeholder="一句话描述想要的音色，例如：低沉沙哑的中年男声">'
        + '<button class="act" id="create"' + (state.creating ? ' disabled' : '') + '>' + (state.creating ? '生成中…' : '新建') + '</button></div></div>'
      if (state.loading) h += '<div class="empty">读取中…</div>'
      else if (!names.length) h += '<div class="empty">音色库是空的。</div>'
      else {
        h += '<div class="card">'
        names.forEach(function (n) {
          var e = state.bank[n] || {}
          h += '<div class="item"><div class="row"><span class="name" title="' + esc(n) + '">' + esc(n) + '</span><span class="grow"></span>'
            + (e.sample_mp3 ? '<button class="act play" data-p="' + esc(e.sample_mp3) + '">试听</button>' : '')
            + '<button class="act ren" data-n="' + esc(n) + '">改名</button><button class="act del" data-n="' + esc(n) + '">删除</button></div>'
            + '<div class="dim">' + esc((e.kind || '?') + (e.note ? ' · ' + e.note : '')) + '</div></div>'
        })
        h += '</div>'
      }
    }
    el('view').innerHTML = h
    bind()
  }

  // 选文件后的统一读取：Word 走解析接口，其它按纯文本读
  function isWordFile(name) { return /\.(docx|doc)$/i.test(String(name || '')) }
  function readPickedFile(file, onText, onErr) {
    if (isWordFile(file.name)) {
      var reader = new FileReader()
      reader.onerror = function () { onErr('读不了这个文件') }
      reader.onload = function () {
        var bytes = new Uint8Array(reader.result)
        var bin = ''
        for (var i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000))
        }
        var b64 = ''
        try { b64 = btoa(bin) } catch (e) { onErr('文件太大或编码异常'); return }
        post('docx.json', { name: file.name, base64: b64 }).then(function (j) {
          if (!j.ok) { onErr(j.error || '解析失败'); return }
          onText(String(j.text || ''))
        }).catch(function (e) { onErr(String(e && e.message ? e.message : e)) })
      }
      reader.readAsArrayBuffer(file)
      return
    }
    var tr = new FileReader()
    tr.onerror = function () { onErr('读不了这个文件') }
    tr.onload = function () { onText(String(tr.result || '')) }
    tr.readAsText(file)
  }

  var JOB_LABEL = { queued: '排队中', running: '正在合成', done: '完成', failed: '失败' }

  function renderQueue() {
    var q = state.queue
    if (!q || !q.jobs) return '<div class="empty">读取中…</div>'
    var c = q.counts || {}
    var h = '<div class="row" style="margin-bottom:8px"><span class="dim">共 ' + (c.total || 0) + ' 条（排队 ' + (c.queued || 0)
      + ' / 完成 ' + (c.done || 0) + ' / 失败 ' + (c.failed || 0) + '）' + (q.paused ? ' · 已暂停' : '') + '</span><span class="grow"></span>'
      + '<button class="act" id="qpause">' + (q.paused ? '继续' : '暂停') + '</button>'
      + '<button class="act" id="qstop"' + (q.running ? '' : ' disabled') + '>停止当前</button>'
      + '<button class="act" id="qclear">清空未完成</button></div>'

    var isPr = state.draft.type === 'timeline'
    h += '<div class="card"><div class="row" style="margin-bottom:6px"><span class="dim">新任务</span>'
      + '<select class="act" id="qtype">'
      + '<option value="text"' + (isPr ? '' : ' selected') + '>单段文案</option>'
      + '<option value="timeline"' + (isPr ? ' selected' : '') + '>PR 时间轴</option>'
      + '</select></div>'
    if (isPr) {
      h += '<div class="row"><span class="dim" style="width:76px">时间轴 XML</span>'
        + '<input type="file" id="qxmlfile" accept=".xml,text/xml,application/xml" style="flex:1;min-width:0;font-size:12px">'
        + '<span class="dim">' + (state.draft.xmlName ? esc(state.draft.xmlName) : '未选择') + '</span></div>'
        + '<div class="row" style="margin-top:6px"><span class="dim" style="width:76px">外侧文案</span>'
        + '<input type="file" id="qscriptfile" accept=".txt,.md,.docx,.doc,text/plain" style="flex:1;min-width:0;font-size:12px">'
        + '<span class="dim">' + (state.draft.scriptName ? esc(state.draft.scriptName) : '未选择') + '</span></div>'
        + '<div class="dim" style="margin-top:4px">选好会自动读取内容，文件会存到工作目录的 <code>.dsh-tts/uploads/</code>。PR 里要先打好范围标记（名称 01、02…）。</div>'
    } else {
      h += '<div class="row" style="margin-bottom:6px"><span class="dim" style="width:76px">从文件导入</span>'
        + '<input type="file" id="qtextfile" accept=".txt,.md,.markdown,.docx,.doc,text/plain" style="flex:1;min-width:0;font-size:12px">'
        + '<span class="dim">' + (state.draft.textName ? esc(state.draft.textName) : '可选') + '</span></div>'
        + '<textarea id="qtext" placeholder="要配音的文案，可多段；按句自动切分（也可以从上面的文件导入）" style="width:100%;min-height:64px;font:inherit;font-size:12px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:transparent;color:inherit;resize:vertical">' + esc(state.draft.text) + '</textarea>'
    }
    h += '<div class="row" style="margin-top:6px"><input type="text" id="qvoice" value="' + esc(state.draft.voice) + '" placeholder="音色（留空用默认）" style="max-width:46%">'
      + '<input type="text" id="qtitle" value="' + esc(state.draft.title) + '" placeholder="' + (isPr ? '输出目录名（留空自动）' : '文件名（留空自动）') + '" style="max-width:46%">'
      + (isPr ? '<input type="text" id="qseq" value="' + esc(state.draft.sequence) + '" placeholder="序列号" style="max-width:70px">' : '')
      + '<button class="act" id="qadd">加入队列</button></div>'
      + '<div class="dim" style="margin-top:6px;line-height:1.6">'
      + '音色可填：预设名（Serena / Uncle_Fu / Vivian / Dylan / Eric）、音色库里的名字、一段描述（如「低沉沙哑的中年男声」），或参考音视频的本地路径；'
      + '留空用默认音色（当前：' + esc((state.status && state.status.defaultVoice) || '未设置') + '）。'
      + (isPr
        ? '<br>PR 任务是一条队列记录，内部逐段合成并显示「第几段/共几段」；预检不过会直接失败并给出原因（不烧 GPU）。'
        : '<br>文案可以直接贴，也可以选 .txt/.md 导入（导入后仍可编辑）；会按句切分生成字幕，长文案自动分批。')
      + '加入后立即开始（除非已暂停），一次只跑一条。'
      + '</div></div>'

    if (!q.jobs.length) return h + '<div class="empty">队列是空的。</div>'
    h += '<div class="card">'
    q.jobs.forEach(function (job) {
      var color = job.status === 'running' ? 'var(--accent)' : job.status === 'done' ? 'var(--ok)' : job.status === 'failed' ? 'var(--err)' : 'var(--dim)'
      var title = job.title || (job.type === 'timeline'
        ? (String(job.xmlFile || '').split(/[\\/]/).pop() || 'PR 任务')
        : (job.text.length > 40 ? job.text.slice(0, 40) + '…' : job.text))
      h += '<div class="item"><div class="row"><i class="dot" style="background:' + color + '"></i>'
        + '<span class="name" style="flex:1" title="' + esc(job.text) + '">' + esc(title) + '</span>'
        + (job.type === 'timeline' ? '<span class="dim" style="border:1px solid var(--line);border-radius:8px;padding:0 5px">PR</span>' : '')
        + '<span class="dim">' + esc(JOB_LABEL[job.status] || job.status) + (job.detail ? ' · ' + esc(job.detail) : '') + '</span>'
        + (job.status === 'failed' ? '<button class="act qretry" data-id="' + job.id + '">重试</button>' : '')
        + (job.status === 'running' ? '' : '<button class="act qdel" data-id="' + job.id + '">删除</button>')
        + '</div>'
        + (job.error ? '<div class="dim" style="color:var(--err)">' + esc(job.error) + '</div>' : '')
        + (job.files && job.files.length ? '<div class="dim">产出：' + esc(job.files.map(function (f) { return f.split(/[\\/]/).pop() }).join('、')) + '</div>' : '')
        + '</div>'
    })
    h += '</div>'
    return h
  }

  function renderConfig() {
    var cfg = state.config
    if (!cfg) return '<div class="empty">读取中…</div>'
    var h = '<div class="row" style="margin-bottom:8px"><span class="dim">改完点保存；标「需重启」的要重启 DSH 才生效</span><span class="grow"></span><button class="act" id="savecfg"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : '保存') + '</button></div>'
    if (state.saveMsg) h += '<div class="err" style="color:var(--ok)">' + esc(state.saveMsg) + '</div>'
    h += '<div class="card">'
    ;(cfg.fields || []).forEach(function (f) {
      var v = cfg.values ? cfg.values[f.key] : ''
      var badge = f.live ? '' : ' <span class="dim" style="border:1px solid var(--line);border-radius:8px;padding:0 5px">需重启</span>'
      h += '<div class="item"><div class="row"><span>' + esc(f.label) + badge + '</span><span class="grow"></span>'
      if (f.kind === 'bool') {
        h += '<input type="checkbox" data-k="' + f.key + '" data-kind="bool"' + (v ? ' checked' : '') + '>'
      } else if (f.kind === 'voice') {
        // 下拉里给音色库和预设，同时允许手输（描述造音色也走这条路）
        var opts = cfg.voiceOptions || []
        h += '<input type="text" list="voiceopts" data-k="' + f.key + '" data-kind="string" value="' + esc(v == null ? '' : v) + '" style="max-width:46%">'
        h += '<datalist id="voiceopts">' + opts.map(function (o) {
          return '<option value="' + esc(o.value) + '">' + esc(o.group) + '</option>'
        }).join('') + '</datalist>'
      } else if (f.kind === 'enum') {
        h += '<select class="act" data-k="' + f.key + '" data-kind="enum">' + f.options.map(function (o) {
          var text = (f.optionLabels && f.optionLabels[o]) ? f.optionLabels[o] : o
          return '<option value="' + esc(o) + '"' + (String(v) === o ? ' selected' : '') + '>' + esc(text) + '</option>'
        }).join('') + '</select>'
      } else if (f.kind === 'json') {
        h += '<input type="text" data-k="' + f.key + '" data-kind="json" value="' + esc(JSON.stringify(v === undefined ? (f.key === 'blurWords' ? [] : {}) : v)) + '" style="max-width:46%">'
      } else if (f.kind === 'int' || f.kind === 'number') {
        h += '<input type="number" class="act" data-k="' + f.key + '" data-kind="' + f.kind + '" value="' + esc(v) + '" step="' + (f.kind === 'number' ? '0.05' : '1') + '" style="max-width:110px">'
      } else {
        h += '<input type="text" data-k="' + f.key + '" data-kind="string" value="' + esc(v == null ? '' : v) + '" style="max-width:46%">'
      }
      h += '</div>' + (f.hint ? '<div class="dim">' + esc(f.hint) + '</div>' : '') + '</div>'
    })
    h += '</div>'
    var ros = cfg.readonly || []
    h += '<div class="card"><div class="dim" style="margin-bottom:4px">只读项 —— 这些不能在这里改，改法写在每一项下面</div>'
    ros.forEach(function (r) {
      if (!r || r.value === undefined || r.value === null || r.value === '') return
      var val = String(r.value)
      h += '<div class="item"><div class="row"><span class="dim">' + esc(r.label || '') + '</span><span class="grow"></span>'
        + '<span class="name" style="max-width:62%" title="' + esc(val) + '">' + esc(val.split('\n')[0]) + (val.indexOf('\n') >= 0 ? ' …' : '') + '</span></div>'
        + (r.how ? '<div class="dim">改法：' + esc(r.how) + '</div>' : '') + '</div>'
    })
    if (cfg.settingsFile) h += '<div class="dim" style="margin-top:6px">本页改动存在：' + esc(cfg.settingsFile) + '</div>'
    h += '</div>'
    return h
  }

  function saveConfig() {
    var values = {}
    var nodes = document.querySelectorAll('[data-k]')
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i]
      var k = n.getAttribute('data-k')
      var kind = n.getAttribute('data-kind')
      if (kind === 'bool') values[k] = !!n.checked
      else if (kind === 'json') {
        try { values[k] = JSON.parse(n.value) } catch (e) { state.error = '「' + k + '」不是合法 JSON'; render(); return }
      } else if (kind === 'int' || kind === 'number') values[k] = Number(n.value)
      else values[k] = n.value
    }
    state.saving = true; state.error = ''; state.saveMsg = ''
    render()
    post('config.json', { values: values }).then(function (j) {
      state.saving = false
      if (!j.ok) { state.error = j.error || '保存失败'; render(); return }
      var parts = []
      if (j.applied && Object.keys(j.applied).length) parts.push('已保存 ' + Object.keys(j.applied).length + ' 项')
      if (j.needRestart && j.needRestart.length) parts.push('需重启：' + j.needRestart.join('、'))
      if (j.rejected && j.rejected.length) parts.push('被拒：' + j.rejected.map(function (r) { return r.key + '（' + r.reason + '）' }).join('；'))
      state.saveMsg = parts.join(' · ') || '没有改动'
      state.config = j
      render()
    }).catch(function (e) {
      state.saving = false; state.error = '保存失败：' + (e && e.message ? e.message : e); render()
    })
  }

  function qpost(op, extra) {
    post('queue.json', Object.assign({ op: op }, extra || {})).then(function (j) {
      if (j && j.jobs) state.queue = j
      state.error = (j && j.ok === false) ? (j.error || '操作失败') : ''
      render()
    }).catch(function (e) { state.error = String(e && e.message ? e.message : e); render() })
  }

  function bind() {
    var qtf = el('qtextfile')
    if (qtf) qtf.onchange = function () {
      var f = qtf.files && qtf.files[0]
      if (!f) return
      readPickedFile(f, function (text) {
        state.draft.text = text
        state.draft.textName = f.name
        state.error = ''
        render()
      }, function (msg) { state.error = '读不了这个文件：' + msg; render() })
    }
    var qt = el('qtext')
    if (qt) qt.oninput = function () { state.draft.text = qt.value }
    var qtype = el('qtype')
    if (qtype) qtype.onchange = function () { state.draft.type = qtype.value; state.error = ''; render() }
    var qxf = el('qxmlfile')
    if (qxf) qxf.onchange = function () {
      var f = qxf.files && qxf.files[0]
      if (!f) return
      readPickedFile(f, function (text) {
        state.upload.xmlText = text
        state.draft.xmlName = f.name
        state.error = ''
        render()
      }, function (msg) { state.error = '读不了这个文件：' + msg; render() })
    }
    var qsf = el('qscriptfile')
    if (qsf) qsf.onchange = function () {
      var f2 = qsf.files && qsf.files[0]
      if (!f2) return
      readPickedFile(f2, function (text) {
        state.upload.scriptText = text
        state.draft.scriptName = f2.name
        state.error = ''
        render()
      }, function (msg) { state.error = '读不了这个文件：' + msg; render() })
    }
    var qseq = el('qseq')
    if (qseq) qseq.oninput = function () { state.draft.sequence = qseq.value }
    var qv = el('qvoice')
    if (qv) qv.oninput = function () { state.draft.voice = qv.value }
    var qti = el('qtitle')
    if (qti) qti.oninput = function () { state.draft.title = qti.value }
    var qp = el('qpause')
    if (qp) qp.onclick = function () { qpost(state.queue && state.queue.paused ? 'resume' : 'pause') }
    var qs = el('qstop')
    if (qs) qs.onclick = function () { qpost('stop') }
    var qc = el('qclear')
    if (qc) qc.onclick = function () { qpost('clear') }
    var qa = el('qadd')
    if (qa) qa.onclick = function () {
      if (state.draft.type === 'timeline') {
        if (!state.upload.xmlText || !state.upload.scriptText) { state.error = '先选时间轴 XML 和外侧文案两个文件'; render(); return }
        qpost('add', {
          type: 'timeline',
          xmlText: state.upload.xmlText, xmlName: state.draft.xmlName,
          scriptText: state.upload.scriptText, scriptName: state.draft.scriptName,
          sequence: state.draft.sequence.trim(), voice: state.draft.voice.trim(), title: state.draft.title.trim(),
        })
        state.upload = { xmlText: '', scriptText: '' }
        state.draft = Object.assign({}, state.draft, { xmlName: '', scriptName: '', title: '' })
        return
      }
      var text = state.draft.text.trim()
      if (!text) { state.error = '先写文案再加入队列'; render(); return }
      // 没填文件名就用导入的文件名（去掉扩展名），省得每次手输
      var autoTitle = state.draft.textName ? state.draft.textName.replace(/\.[^.]+$/, '') : ''
      qpost('add', { text: text, voice: state.draft.voice.trim(), title: state.draft.title.trim() || autoTitle })
      state.draft = Object.assign({}, state.draft, { text: '', textName: '', title: '' })
    }
    Array.prototype.forEach.call(document.querySelectorAll('.qretry'), function (b) {
      b.onclick = function () { qpost('retry', { id: b.getAttribute('data-id') }) }
    })
    Array.prototype.forEach.call(document.querySelectorAll('.qdel'), function (b) {
      b.onclick = function () { qpost('remove', { id: b.getAttribute('data-id') }) }
    })
    var sv = el('savecfg')
    if (sv) sv.onclick = saveConfig
    var c = el('cancel')
    if (c) c.onclick = function () { c.disabled = true; c.textContent = '取消中…'; post('cancel.json').catch(function () {}) }
    var r = el('refresh')
    if (r) r.onclick = function () { load() }
    Array.prototype.forEach.call(document.querySelectorAll('.play'), function (b) {
      b.onclick = function () { try { new Audio(fileUrl(b.getAttribute('data-p'))).play() } catch (e) { state.error = '播放失败：' + e.message; render() } }
    })
    Array.prototype.forEach.call(document.querySelectorAll('.ren'), function (b) {
      b.onclick = function () {
        var name = b.getAttribute('data-n')
        var next = window.prompt('把「' + name + '」改成：', name)
        if (!next || next === name) return
        post('bank.json', { op: 'rename', name: name, to: next }).then(function (j) { if (!j.ok) state.error = j.error || '改名失败'; load() })
      }
    })
    Array.prototype.forEach.call(document.querySelectorAll('.del'), function (b) {
      b.onclick = function () {
        var name = b.getAttribute('data-n')
        if (!window.confirm('确定删除「' + name + '」？（只删记录，参考音频不动）')) return
        post('bank.json', { op: 'delete', name: name }).then(function (j) { if (!j.ok) state.error = j.error || '删除失败'; load() })
      }
    })
    var cr = el('create')
    if (cr) cr.onclick = function () {
      var input = el('newvoice')
      var prompt = input && input.value.trim()
      if (!prompt) { state.error = '请先写一句音色描述'; render(); return }
      state.creating = true; state.error = ''; render()
      post('bank.json', { op: 'create', prompt: prompt }).then(function (j) {
        state.creating = false
        if (!j.ok) state.error = j.error || '新建失败'
        load()
      }).catch(function (e) { state.creating = false; state.error = String(e.message || e); render() })
    }
  }

  function load() {
    state.loading = true; state.error = ''; render()
    var job = state.tab === 'history'
      ? api('outputs.json').then(function (j) { if (j.ok === false) state.error = j.error || '读取失败'; else state.files = j.files || [] })
      : state.tab === 'bank'
        ? api('bank.json').then(function (j) { if (j.ok === false) state.error = j.error || '读取失败'; else state.bank = j.entries || {} })
        : state.tab === 'queue'
          ? api('queue.json').then(function (j) { if (j.ok === false) state.error = j.error || '读取失败'; else state.queue = j })
          : state.tab === 'config'
            ? api('config.json').then(function (j) { if (j.ok === false) state.error = j.error || '读取失败'; else state.config = j })
            : Promise.resolve()
    job.catch(function (e) { state.error = '请求失败：' + (e && e.message ? e.message : e) })
      .then(function () { state.loading = false; render() })
  }

  function poll() {
    Promise.all([
      api('status.json').then(function (j) { state.status = j }).catch(function () { state.status = { online: false } }),
      api('queue.json')
        .then(function (j) { state.queue = j; if (state.compatFromApi) state.compatFromApi = '' })
        .catch(function (e) {
          // 队列接口不存在 = 插件还没重启，别静默吞掉
          if (/不存在/.test(String(e && e.message))) state.compatFromApi = '页面调用的接口不存在（' + (e.message || '') + '）'
        }),
    ]).then(function () { if (!typingInView()) render() })
  }

  // 面板每 2 秒重渲染一次；正在输入时跳过，否则光标和内容会被冲掉
  function typingInView() {
    var a = document.activeElement
    if (!a || (a.tagName !== 'INPUT' && a.tagName !== 'TEXTAREA')) return false
    return !!(a.closest && a.closest('#view'))
  }

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.remove('on') })
      b.classList.add('on')
      state.tab = b.getAttribute('data-tab')
      state.error = ''
      if (state.tab === 'task') { render() } else { load() }
    }
  })

  // 注意：不要绑 Esc。它在本应用里是全局快捷键，会直接退出 DSH，
  // 而不是触发这里的返回——用顶部左上角那个按钮就行。
  poll()
  setInterval(poll, 2000)
})()
</script>
</body>
</html>
