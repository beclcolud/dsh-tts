# dsh-tts 的 bundle 补丁层：只把 host 行插进来，不改 profile 的 package.json。
# 可调项都在这里；升级插件不会覆盖这一层。
#
# 机器相关的路径（pythonPath / libs / models / mtModel / workDir / logFile）刻意留空：
# 真实值放本机覆盖文件，不进版本库。脚本能读到的位置（按优先级）：
#   <workDir>/.dsh-tts/settings.json
#   <当前目录>/配音/.dsh-tts/settings.json
#   ~/.dsh-tts/settings.json
# 面板「参数」页改的就是这个文件，也可以手写。
- insert:
    - id: dsh-tts
      name: 'dsh-tts'
      config:
        port: 17321
        pythonPath: ""
        libs: ""
        models: {}
        workDir: ""
        mtModel: ""
        logFile: ""
        language: 'zh'
        defaultVoice: '新闻联播音色'
        idleShutdownMs: 300000
        diction: true
        blur_mode: 'punct'
        blur_sep: '、'
        blur_words: ['答案', '牛奶']
        blur_gap_ms: 80
        busyWaitMs: 0
        seamPolicy: 'target'
        seamPauses:
          '。': 180
          '！': 200
          '？': 200
          '；': 140
